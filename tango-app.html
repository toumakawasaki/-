<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>問題単語帳</title>
<style>
:root{--bg:#f5f5f7;--sf:#fff;--tx:#1d1d1f;--mu:#6e6e73;--bd:#d9d9de;--ac:#0a68d8;--ok:#1a8f4a;--ng:#d33a2f;--okb:#e3f5ea;--ngb:#fbe6e4;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#111114;--sf:#1c1c21;--tx:#f2f2f5;--mu:#9a9aa3;--bd:#33333a;--ac:#4b9bff;--ok:#4cc77f;--ng:#ff7068;--okb:#12301f;--ngb:#3a1816}}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:16px/1.7 -apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;display:flex;flex-direction:column}
main{flex:1;overflow-y:auto;padding:14px;max-width:720px;width:100%;margin:0 auto}
nav{display:flex;border-top:1px solid var(--bd);background:var(--sf)}
nav button{flex:1;padding:12px 0;border:0;background:none;color:var(--mu);font-size:14px}
nav button.on{color:var(--ac);font-weight:700}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:12px}
.meta{font-size:12px;color:var(--mu);margin-bottom:8px}
.badge{display:inline-block;font-weight:700;border-radius:6px;padding:0 8px;margin-right:6px;background:var(--ac);color:#fff}
.q{font-size:17px}
.row{display:flex;gap:10px;margin:12px 0}
.btn{flex:1;padding:14px;border-radius:12px;border:1px solid var(--bd);background:var(--sf);color:var(--tx);font-size:17px;font-weight:700}
.btn.ok{color:var(--ok)}.btn.ng{color:var(--ng)}.btn.pri{background:var(--ac);color:#fff;border-color:var(--ac)}
.res{border-radius:12px;padding:12px;margin-bottom:10px;font-weight:700}
.res.ok{background:var(--okb);color:var(--ok)}.res.ng{background:var(--ngb);color:var(--ng)}
.ex{white-space:pre-wrap;font-size:15px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:8px 16px;border-radius:20px;border:1px solid var(--bd);background:var(--sf);color:var(--mu);font-size:15px}
.chip.on{background:var(--ac);color:#fff;border-color:var(--ac)}
label{display:block;font-size:13px;color:var(--mu);margin:14px 0 4px}
select,input[type=number],textarea{width:100%;padding:10px;border-radius:10px;border:1px solid var(--bd);background:var(--sf);color:var(--tx);font-size:16px}
.two{display:flex;gap:10px;align-items:center}
.small{font-size:13px;color:var(--mu)}
h3{margin:4px 0 8px}
</style>
</head>
<body>
<main id="m"></main>
<nav>
<button data-v="study" class="on">学習</button>
<button data-v="filter">絞り込み</button>
<button data-v="imp">取込</button>
</nav>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ld=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))||d}catch(e){return d}};
const sv=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
let cards=ld('fc_cards',[]),stats=ld('fc_stats',{}),
F=Object.assign({imp:['A','B','C','D'],ch:'',sec:'',min:'',max:'',shuf:true},ld('fc_filter',{})),
Q=[],qi=0,res=null,view='study',msg='';

const norm=s=>s.replace(/[０-９Ａ-Ｄ]/g,c=>String.fromCharCode(c.charCodeAt(0)-65248));

const TOK='[ＲＨ]?\\s*[0-9０-９]+\\s*[ⅠⅡ]*',UNIT=TOK+'(?:[・･]'+TOK+')*\\s*(?:過去問類題|過去問)?';
const SRC=new RegExp('^((?:'+UNIT+')(?:[・･]'+UNIT+')*)?\\s*(※\\s*第\\s*[0-9０-９]+\\s*章)?\\s*(.*)$');
function splitSrc(rest){
  const m=rest.trim().match(SRC),head=[m[1],m[2]].filter(Boolean).join(' ').trim();
  if(head&&!/過去問|※/.test(head))return['',rest.trim()];
  return[head,(m[3]||'').trim()];
}
function parse(text){
  const qs=[],as={};let ch='',sec='',mode='q',cur=null;
  const lines=[];
  for(const raw of text.split(/\r?\n/))for(const p of raw.split(/(?=□□□)/))if(p.trim())lines.push(p);
  for(const raw of lines){
    const t=raw.replace(/^\s*#+\s*/,'').replace(/\*\*/g,'').trim();
    if(!t||t==='問題'||t==='解答'||/^[□\s]+$/.test(t)||/^－.*－$/.test(t)||/^[\u2460-\u24FF\u3251-\u32BF0-9]+[-－]\d+$/.test(t))continue;
    let m=t.match(/^([0-9０-９]+)[．.]\s*(.+?)\s*[★☆]+/);
    if(m){
      const nw=norm(m[1])+'．'+m[2];
      if(nw.replace(/\s+/g,'')!==ch.replace(/\s+/g,'')){ch=nw;sec='';cur=null;mode='q'}
      continue;
    }
    if(mode==='q'&&/^第[0-9０-９]+節/.test(t)&&!t.includes('□□□')){sec=t;cur=null;continue}
    m=t.match(/(?:□+\s*)?問題\s*([0-9０-９]+)\s*重要度\s*([ＡＢＣＤABCD])\s*(.*)$/);
    if(m){mode='q';const [src,body]=splitSrc(m[3]);cur={ch,sec,n:norm(m[1]),imp:norm(m[2]),src,text:body};qs.push(cur);continue}
    m=t.match(/^(?:□+\s*)?問題\s*([0-9０-９]+)\s*(正しい|誤り)\s*(.*)$/);
    if(m){mode='a';const lead=m[3].trim();cur={text:lead+(lead&&!lead.endsWith('。')?'\n':''),ans:m[2]};as[ch+'|'+norm(m[1])]=cur;continue}
    m=t.match(/^(?:□+\s*)?問題\s*([0-9０-９]+)\s*$/);
    if(m&&(mode==='a'||!qs.length||qs[qs.length-1].n!==norm(m[1]))){mode='a';cur={text:'',ans:''};as[ch+'|'+norm(m[1])]=cur;continue}
    if(cur){
      const a=cur.text;
      if(a.endsWith('。')&&/^(なお|（|第)/.test(t))cur.text=a+'\n'+t;
      else if(a&&/[A-Za-z0-9]$/.test(a)&&/^[A-Za-z0-9]/.test(t))cur.text=a+' '+t;
      else cur.text=a+t;
    }
  }
  const fix=s=>s.replace(/([^\x00-\x7F]) +(?=[^\x00-\x7F])/g,'$1');
  const out=[];let miss=0;
  for(const q of qs){
    const a=as[q.ch+'|'+q.n];if(!a){miss++;continue}
    out.push({id:q.ch+'|'+q.n+'|'+q.text.slice(0,12),ch:q.ch||'(章なし)',sec:q.sec,n:q.n,imp:q.imp,src:q.src,q:fix(q.text)||'(問題文を読み取れませんでした。PDFで確認してください)',ans:a.ans,ex:fix(a.text)});
  }
  return {out,miss};
}

function cnt(c){return (stats[c.id]||{}).c||0}
function filtered(){
  const mn=F.min===''?-1:+F.min,mx=F.max===''?1e9:+F.max;
  return cards.filter(c=>F.imp.includes(c.imp)&&(!F.ch||c.ch===F.ch)&&(!F.sec||c.sec===F.sec)&&cnt(c)>=mn&&cnt(c)<=mx);
}
function build(){
  Q=filtered().map(c=>c.id);
  if(F.shuf)for(let i=Q.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[Q[i],Q[j]]=[Q[j],Q[i]]}
  qi=0;res=null;
}
function judge(says){
  const c=cards.find(x=>x.id===Q[qi]);
  const ok=(c.ans==='正しい')===says;
  const s=stats[c.id]||(stats[c.id]={c:0,w:0});
  ok?s.c++:s.w++;sv('fc_stats',stats);res=ok;draw();
}
function next(){qi++;res=null;draw()}

function study(){
  if(!cards.length)return '<div class="card">問題がありません。「取込」タブでmdファイルを読み込んでください。</div>';
  if(!Q.length)return '<div class="card">この条件に合う問題がありません。「絞り込み」で条件を変えてください。</div><button class="btn pri" onclick="go(\'filter\')">絞り込みへ</button>';
  if(qi>=Q.length)return `<div class="card"><h3>${Q.length}問 完了</h3></div><button class="btn pri" onclick="build();draw()">もう一度</button>`;
  const c=cards.find(x=>x.id===Q[qi]),s=stats[c.id]||{c:0,w:0};
  let h=`<div class="small">${qi+1} / ${Q.length}</div><div class="card"><div class="meta"><span class="badge">${c.imp}</span>${esc(c.ch)}${c.sec?' ／ '+esc(c.sec):''} ／ 問題${esc(c.n)}<br>${esc(c.src)}　正答${s.c}回・誤答${s.w}回</div><div class="q">${esc(c.q)}</div></div>`;
  const nv=c.ans!=='正しい'&&c.ans!=='誤り';
  if(res===null&&nv){
    h+='<button class="btn pri" style="width:100%" onclick="res=\'view\';draw()">解説を見る</button><div style="height:8px"></div><button class="btn" style="width:100%" onclick="next()">スキップ</button>';
  }else if(res===null){
    h+='<div class="row"><button class="btn ok" onclick="judge(true)">○ 正しい</button><button class="btn ng" onclick="judge(false)">× 誤り</button></div><button class="btn" style="width:100%" onclick="next()">スキップ</button>';
  }else{
    h+=`${res==='view'?'':`<div class="res ${res?'ok':'ng'}">${res?'正解':'不正解'}　答え：${c.ans}</div>`}<div class="card ex">${esc(c.ex||'(解説なし)')}</div><button class="btn pri" style="width:100%" onclick="next()">次へ</button>`;
  }
  return h;
}

function filt(){
  const chs=[...new Set(cards.map(c=>c.ch))];
  const secs=[...new Set(cards.filter(c=>!F.ch||c.ch===F.ch).map(c=>c.sec).filter(Boolean))];
  const n=filtered().length;
  return `<h3>重要度</h3><div class="chips">${['A','B','C','D'].map(k=>`<button class="chip ${F.imp.includes(k)?'on':''}" onclick="tg('${k}')">${k}</button>`).join('')}</div>
<label>章</label><select onchange="F.ch=this.value;F.sec='';fc()"><option value="">すべて</option>${chs.map(c=>`<option ${c===F.ch?'selected':''} value="${esc(c)}">${esc(c)}</option>`).join('')}</select>
<label>節</label><select onchange="F.sec=this.value;fc()"><option value="">すべて</option>${secs.map(c=>`<option ${c===F.sec?'selected':''} value="${esc(c)}">${esc(c)}</option>`).join('')}</select>
<label>正答数（回）</label><div class="two"><input type="number" inputmode="numeric" min="0" placeholder="最小" value="${F.min}" onchange="F.min=this.value;fc()"><span>〜</span><input type="number" inputmode="numeric" min="0" placeholder="最大" value="${F.max}" onchange="F.max=this.value;fc()"></div>
<div class="chips" style="margin-top:8px"><button class="chip" onclick="F.min='';F.max='0';fc()">未正解</button><button class="chip" onclick="F.min='';F.max='2';fc()">2回以下</button><button class="chip" onclick="F.min='3';F.max='';fc()">3回以上</button><button class="chip" onclick="F.min='';F.max='';fc()">解除</button></div>
<label><input type="checkbox" ${F.shuf?'checked':''} onchange="F.shuf=this.checked;sv('fc_filter',F)"> シャッフルする</label>
<p>該当：<b>${n}</b> 問</p><button class="btn pri" style="width:100%" onclick="build();go('study')">この条件で学習開始</button>`;
}
function fc(){sv('fc_filter',F);draw()}
function tg(k){const i=F.imp.indexOf(k);i<0?F.imp.push(k):F.imp.splice(i,1);fc()}

function imp(){
  return `<h3>ファイルの取込 <span class="small">v5</span></h3><p class="small">ファイルを選ぶだけで、問題・重要度・章節・解答を自動で読み取ります。内容はこの端末のブラウザ内だけで処理され、外部には送信されません。複数ファイルをまとめて選べます。</p><input type="file" id="fi" multiple onchange="onFile(this.files)">
<p class="small">${esc(msg)}</p><p>登録済み：<b>${cards.length}</b> 問</p>
<div class="row"><button class="btn" onclick="if(confirm('正答数をすべてリセットしますか？')){stats={};sv('fc_stats',stats);msg='正答数をリセットしました';draw()}">正答数リセット</button><button class="btn ng" onclick="if(confirm('問題データをすべて削除しますか？')){cards=[];stats={};sv('fc_cards',cards);sv('fc_stats',stats);Q=[];draw()}">全削除</button></div>`;
}
function addText(t){
  const r=parse(t);
  const ids=new Set(r.out.map(c=>c.id));
  cards=cards.filter(c=>!ids.has(c.id)).concat(r.out);
  sv('fc_cards',cards);build();
  msg=`${r.out.length}問を取り込みました`+(r.miss?`（解答が見つからない${r.miss}問は除外）`:'');draw();
}
function jparse(t){
  try{
    let a=JSON.parse(t.replace(/^\uFEFF/,''));
    if(a&&!Array.isArray(a))a=a.cards;
    if(!Array.isArray(a))return{out:[],miss:0,err:'配列形式ではありません'};
    const out=a.filter(c=>c&&(c.q||c.text)).map((c,i)=>{const q=c.q||c.text;return{id:c.id||(c.ch+'|'+c.n+'|'+String(q).slice(0,12)),ch:c.ch||'(章なし)',sec:c.sec||'',n:c.n||i+1,imp:c.imp||'D',src:c.src||'',q,ans:c.ans,ex:c.ex||''}});
    return{out,miss:0,err:out.length?'':'カードが0件（項目名が一致しません）'};
  }catch(e){return{out:[],miss:0,err:'JSON読込エラー: '+e.message}}
}
function onFile(fl){
  Promise.all([...fl].map(f=>f.text().then(t=>[f.name,t]))).then(rs=>{
    let tot=0,miss=0,names=[];
    for(const [n,t] of rs){
      let r;
      if(/\.json$/i.test(n)||/^\s*[\[{]/.test(t))r=jparse(t);
      else r=parse(t);
      const ids=new Set(r.out.map(c=>c.id));
      cards=cards.filter(c=>!ids.has(c.id)).concat(r.out);
      tot+=r.out.length;miss+=r.miss;names.push(n+'：'+r.out.length+'問'+(r.err?'（'+r.err+'）':''));
    }
    sv('fc_cards',cards);build();
    msg=names.join(' ／ ')+(miss?`（解答が見つからず除外 ${miss}問）`:'');draw();
  });
}
function go(v){view=v;document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));draw()}
function draw(){const m=$('#m');m.innerHTML=view==='study'?study():view==='filter'?filt():imp();m.scrollTop=0}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>go(b.dataset.v));
build();draw();
</script>
</body>
</html>
